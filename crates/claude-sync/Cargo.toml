[package]
name = "claude-sync"
version = "0.1.0"
edition = "2024"
description = "Live-sync a team's Claude Code setup (CLAUDE.md, skills, commands, agents, hooks, MCP servers, permissions) while everyone keeps their own subscription."
license = "MIT"

[lib]
name = "claude_sync"
path = "src/lib.rs"

[[bin]]
name = "claude-sync"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", features = ["ws"] }
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
parking_lot = "0.13.0"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
similar = "3.2.1"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
