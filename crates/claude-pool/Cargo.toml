[package]
name = "claude-pool"
version = "0.1.0"
edition = "2024"
description = "High-performance gateway that pools multiple Claude API accounts for a team: smart routing, failover, prompt-cache affinity, usage tracking and alerts."
license = "MIT"
readme = "README.md"
keywords = ["claude", "anthropic", "proxy", "load-balancer", "llm"]
categories = ["web-programming::http-server", "command-line-utilities"]

[lib]
name = "claude_pool"
path = "src/lib.rs"

[[bin]]
name = "claude-pool"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = "0.8"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
futures-util = "0.3.34"
http = "1.5.0"
memchr = "2.8.3"
mimalloc = { version = "0.1.52", optional = true }
parking_lot = "0.13.0"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "http2", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["raw_value"] }
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[features]
default = ["mimalloc"]
mimalloc = ["dep:mimalloc"]
